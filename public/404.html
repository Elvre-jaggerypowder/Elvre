  <body>
    <!-- ⭐⭐⭐ FIXED SCRIPT – handles both path param and direct 404 ───>
    <script>
      (function() {
        // If we are on the root path, do nothing
        if (window.location.pathname === '/' || window.location.pathname === '') {
          return;
        }

        // Check if there is a 'path' parameter from 404.html redirect
        var params = new URLSearchParams(window.location.search);
        var path = params.get('path');

        if (path) {
          // Decode and restore the original URL (excluding the query param)
          var cleanUrl = decodeURIComponent(path);
          // Use replaceState so browser back button works
          history.replaceState(null, '', cleanUrl);
        } else {
          // No 'path' param – this might be a direct 404 (e.g., /auth/callback)
          // We'll redirect to the root with the path as a query param,
          // so that the SPA can handle it.
          var currentPath = window.location.pathname + window.location.search;
          window.location.href = '/' + '?path=' + encodeURIComponent(currentPath);
        }
      })();
    </script>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
